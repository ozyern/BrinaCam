name: Build APK

on:
  push:
    branches: [ 'claude/**', 'master', 'main' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The native code uses gnustl + GCC/OpenMP, which only exist in NDK r17c and older.
      - name: Install NDK r16b
        run: |
          curl -sSfL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q ndk.zip -d $HOME
          echo "NDK_ROOT=$HOME/android-ndk-r16b" >> $GITHUB_ENV

      - name: Build native libraries
        run: $NDK_ROOT/ndk-build -j$(nproc) NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk APP_ALLOW_MISSING_DEPS=true APP_DEPRECATED_HEADERS=true APP_CFLAGS="-include stdlib.h -include string.h" -k

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp build/outputs/apk/release/*.apk OpenCamera-redesign.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCamera-redesign-apk
          path: OpenCamera-redesign.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenCamera redesign build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: OpenCamera-redesign.apk
