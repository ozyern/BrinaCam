name: Build APK

on:
  push:
    branches: [ 'claude/**', 'master', 'main' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The native code uses gnustl + GCC/OpenMP, which only exist in NDK r17c and older.
      - name: Install NDK r16b
        run: |
          curl -sSfL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q ndk.zip -d $HOME
          echo "NDK_ROOT=$HOME/android-ndk-r16b" >> $GITHUB_ENV

      - name: Build native libraries
        run: $NDK_ROOT/ndk-build -j$(nproc) NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk APP_ALLOW_MISSING_DEPS=true APP_DEPRECATED_HEADERS=true APP_CFLAGS="-include stdlib.h -include string.h -Ijni/include" -k

      # 64-bit libraries for devices without 32-bit support (e.g. Snapdragon 8 Gen 3 / Elite phones).
      - name: Build libjpeg-turbo (64-bit)
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          echo "NDK_LATEST=$NDK" >> $GITHUB_ENV
          curl -sSfL -o turbo.tar.gz https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/2.1.5.1.tar.gz
          tar xzf turbo.tar.gz
          SRC=$PWD/libjpeg-turbo-2.1.5.1
          # x86_64 is only used for the emulator smoke test.
          for ABI in arm64-v8a x86_64; do
            cmake -S $SRC -B turbo-$ABI -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=OFF -DWITH_TURBOJPEG=OFF -DWITH_SIMD=$([ $ABI = x86_64 ] && echo OFF || echo ON) \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build turbo-$ABI --target jpeg-static
            OUT=jni/prebuilt/$ABI/libjpeg-turbo
            mkdir -p $OUT/include
            cp turbo-$ABI/libjpeg.a $OUT/
            cp $SRC/*.h turbo-$ABI/*.h $OUT/include/
          done

      - name: Build native libraries (64-bit)
        run: $NDK_LATEST/ndk-build -j$(nproc) NDK_PROJECT_PATH=. NDK_OUT=obj-arm64 APP_BUILD_SCRIPT=jni/Android-arm64.mk NDK_APPLICATION_MK=jni/Application-arm64.mk

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls build/outputs/apk/release/
          cp build/outputs/apk/release/*arm64-v8a*.apk BrinaCam-arm64.apk
          cp build/outputs/apk/release/*armeabi-v7a*.apk BrinaCam-armv7.apk
          cp build/outputs/apk/release/*x86_64*.apk smoke-test-x86_64.apk

      # Launch the 64-bit build on an emulator and keep the crash log and a screenshot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash .github/scripts/smoke-test.sh smoke-test-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BrinaCam-apk
          path: BrinaCam-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BrinaCam build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            BrinaCam-*.apk
            smoke-test/*
