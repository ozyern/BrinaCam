name: Build APK

on:
  push:
    branches: [ 'claude/**', 'master', 'main' ]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so the single release below is never raced.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Releases used to be one per build (build-N); only a single "latest" is kept now.
      - name: Remove old numbered releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^build-[0-9]+$' \
            | while read -r tag; do
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk BrinaCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BrinaCam-apk
          path: BrinaCam.apk

      # Launch the app on an emulator, take a photo, and keep screenshots + logs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash .github/scripts/smoke-test.sh BrinaCam.apk

      - name: Replace the previous latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BrinaCam (latest build)
          body: Built from ${{ github.sha }} on ${{ github.ref_name }}.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            BrinaCam.apk
            smoke-test/*
